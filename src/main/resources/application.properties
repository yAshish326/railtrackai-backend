spring.application.name=railtrack-backend
server.port=${PORT:8081}

# =====================================================
# PostgreSQL Configuration
# =====================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# =====================================================
# JPA
# =====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =====================================================
# Rapid API
# =====================================================
rapidapi.base-url=https://irctc-indian-railway-pnr-status.p.rapidapi.com
rapidapi.host=irctc-indian-railway-pnr-status.p.rapidapi.com
rapidapi.key=${RAPIDAPI_KEY}

# =====================================================
# API FOR train between stations
# =====================================================
railway.api.base-url=https://api.railradar.in/v1
railway.api.key=${RAILRADAR_API_KEY}

# =====================================================
# JWT
# =====================================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# =====================================================
# Groq AI Configuration
# =====================================================
groq.api.base-url=https://api.groq.com/openai/v1
groq.api.key=${GROQ_API_KEY}
groq.api.model=openai/gpt-oss-120b
groq.api.temperature=0.7

# =====================================================
# Resend Email Configuration (HTTPS API over Port 443)
# =====================================================
resend.api.key=${RESEND_API_KEY}
resend.from.email=onboarding@resend.dev
# =====================================================
# Brevo Email Configuration (HTTPS Port 443)
# =====================================================
brevo.api.key=${BREVO_API_KEY:xkeysib_dummy_key_for_local_dev}
brevo.from.email=aashishyadav326@gmail.com
